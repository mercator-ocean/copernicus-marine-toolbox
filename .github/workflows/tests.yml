name: Run tests

on:
  pull_request:
    branches:
      - "main"
      - "release/**"
      - "pre-release/**"
  push:
    branches:
      - "main"

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        coverage: [with-coverage, fast-and-without-coverage]
    runs-on: cmt-runners
    timeout-minutes: 30
    env:
      ACTIONS_STEP_DEBUG: true

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install and configure Poetry
        run: |
          python3.13 -m pip install poetry
          python3.13 -m poetry config virtualenvs.in-project true
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: ~/.cache
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          python3.13 -m poetry install --no-interaction --no-root
      - name: Install ncdump dependency
        run: sudo apt-get install -y netcdf-bin
      - name: Install library
        run: python3.13 -m poetry install --no-interaction --with dev --all-extras
      - name: Run tests
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          if [ "${{ matrix.coverage}}" == "fast-and-without-coverage" ]; then
            python3.13 -m poetry run make run-quick-tests
          else
            python3.13 -m poetry run make run-cov-tests
          fi
      - name: Upload coverage reports to Codecov
        if: matrix.coverage == 'with-coverage'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # 7.1.1
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
