name: Run login tests

# These tests exercise the authentication against the Copernicus Marine
# Authentication System and therefore require valid credentials (secrets).
# Secrets are not exposed to pull requests coming from forks, so there is no
# point running these tests there (they would fail for lack of credentials).
#
# GitHub Actions does not allow the `secrets` context in `if:` conditions, so
# we use a lightweight gate job that maps the secret into an env var, turns
# "is it set?" into a job output, and the actual test job depends on it. This
# way the tests are automatically skipped whenever the secrets are unavailable
# (forks, or a repository where they are simply not configured), without ever
# hard-coding which repository is "the main one".
#
# The rest of the test suite runs without secrets (see tests.yml and
# tests_on_oss.yml) and therefore works on forks.

on:
  pull_request:
    branches:
      - "main"
      - "release/**"
      - "pre-release/**"
  push:
    branches:
      - "main"

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has-credentials: ${{ steps.check.outputs.has-credentials }}
    steps:
      - name: Check that credentials secrets are available
        id: check
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          if [ -n "$COPERNICUSMARINE_SERVICE_USERNAME" ] && [ -n "$COPERNICUSMARINE_SERVICE_PASSWORD" ]; then
            echo "Credentials secrets are available: login tests will run."
            echo "has-credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "Credentials secrets are not available (e.g. fork PR): login tests will be skipped."
            echo "has-credentials=false" >> "$GITHUB_OUTPUT"
          fi

  login-tests:
    needs: check-secrets
    if: needs.check-secrets.outputs.has-credentials == 'true'
    runs-on: cmt-runners
    timeout-minutes: 30
    env:
      ACTIONS_STEP_DEBUG: true

    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and configure Poetry
        run: |
          python3.13 -m pip install poetry
          python3.13 -m poetry config virtualenvs.in-project true
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          python3.13 -m poetry install --no-interaction --no-root
      - name: Install ncdump dependency
        run: sudo apt-get install -y netcdf-bin
      - name: Install library
        run: python3.13 -m poetry install --no-interaction --with dev --all-extras
      - name: Run login tests
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python3.13 -m poetry run make run-login-tests
