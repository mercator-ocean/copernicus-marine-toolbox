name: Run tests binaries windows

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release/**"
      - "pre-release/**"
  pull_request:
    branches:
      - "main"
    paths:
      - "pyproject.toml"
      - "conda_environment_binary.yaml"
      - "conda_environment_binary_extra.yaml"
      - "tests_extra/test_basic_commands_binaries.py"
      - "Makefile"
      - ".github/workflows/binary-test-windows.yml"

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        variant: [core, extra]
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - name: Check out code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        fetch-depth: 0

    - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
      with:
        micromamba-version: '1.5.6-0'
        micromamba-binary-path: ${{ runner.temp }}\Scripts\micromamba.exe
        environment-file: conda_environment_binary.yaml
        environment-name: copernicusmarine-binary
        condarc-file: .condarc
        cache-environment: true
        post-cleanup: 'all'

    - name: Build with PyInstaller
      shell: bash -el {0}
      run: |
        make run-using-pyinstaller-windows-latest VARIANT=${{ matrix.variant }}

    - name: Run tests
      env:
        COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
        COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        BINARY_NAME: "./dist/copernicusmarine${{ matrix.variant == 'extra' && '-extra' || '' }}.exe"
        BINARY_VARIANT: ${{ matrix.variant }}
        PYTHONIOENCODING: utf-8
      run: make run-tests-binaries
      shell: bash -el {0}
