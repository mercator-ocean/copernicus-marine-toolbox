name: Create Binaries Windows

on:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [core, extra]
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        fetch-depth: 0

    - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
      with:
        micromamba-version: '1.5.6-0'
        micromamba-binary-path: ${{ runner.temp }}\Scripts\micromamba.exe
        environment-file: conda_environment_binary.yaml
        environment-name: copernicusmarine-binary
        condarc-file: .condarc
        cache-environment: true
        post-cleanup: 'all'

    - name: Build with PyInstaller
      shell: bash -el {0}
      run: |
        make run-using-pyinstaller-windows-latest VARIANT=${{ matrix.variant }}

    - name: Set VERSION environment variable
      id: set-version
      shell: bash -el {0}
      run: echo "VERSION=$(poetry version --short)" >> $GITHUB_OUTPUT

    - name: Upload binaries to windows
      shell: bash -el {0}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
          if [ "${{ matrix.variant }}" == "extra" ]; then
            SUFFIX="-extra"
          else
            SUFFIX=""
          fi
          gh release upload v${{steps.set-version.outputs.VERSION}} dist/copernicusmarine${SUFFIX}.exe#copernicusmarine-binary-windows${SUFFIX}-for-v${{steps.set-version.outputs.VERSION}}
